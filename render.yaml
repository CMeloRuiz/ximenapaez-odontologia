# Despliegue en Render como Static Site.
# Equivale a configurar a mano: Root Directory `frontend`,
# Build Command `npm install && npm run build`, Publish Directory `dist`.
services:
  - type: web
    name: ximena-paez-odontologia
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: false
    headers:
      # Los assets salen del build con hash en el nombre: caché larga.
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
